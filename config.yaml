# Konfiguracja dev-agents. Ścieżki względne liczone od położenia tego pliku.
# Klucze i adresy endpointów NIE są tu zapisane - config trzyma tylko nazwy zmiennych środowiskowych.
# Przejście na miasto: w każdej parze zakomentuj linię z Kwadratu i odkomentuj linię pod nią.

llm:
  profiles:
    small:
      provider: openai_compatible
      model: claude-haiku-5-5
      # model: azure/genai4all/gpt-5-no-filter
      api_key_env: LLM_API_KEY
      # api_key_env: BAZOOKA_KEY
      base_url_env: LLM_BASE_URL
      # base_url_env: BAZOOKA_URL
      structured_output_method: json_schema
      params: { max_tokens: 16000 }
      # params: { max_tokens: 16000, reasoning_effort: low }
    medium:
      provider: openai_compatible
      model: claude-sonnet-5-5
      # model: azure/genai4all/gpt-5-no-filter
      api_key_env: LLM_API_KEY
      # api_key_env: BAZOOKA_KEY
      base_url_env: LLM_BASE_URL
      # base_url_env: BAZOOKA_URL
      structured_output_method: json_schema
      params: { max_tokens: 32000 }
      # params: { max_tokens: 32000, reasoning_effort: low }
  agents:
    planner: small
    analyst: small
    flow_writer: medium
    writer: medium
    reviewer: medium

paths:
  prompts: prompts
  knowledge_base: knowledge_base
  # Szablon przewodnika: zakładki i sekcje (typ, źródło, polecenie dla pisarza) - zmiana bez programowania.
  guide_template: knowledge_base/templates/guide_template.yaml

scan:
  # Pliki i katalogi pomijane przy skanowaniu analizowanego projektu (wzorce nazw, np. *.pyc).
  # Zawsze pomijane, niezależnie od tej listy: dev_agents_doc/ (wyniki towaru) i katalogi z pyvenv.cfg (venv).
  ignore: [".git", "__pycache__", ".pytest_cache", ".idea", ".vscode", "node_modules", "venv", ".venv", "*.pyc", "Thumbs.db", "desktop.ini", "~$*"]
  # Pliki sekretów (certyfikaty, klucze, .env) - do modelu i przewodnika trafiają wyłącznie jako metadane.
  secret_patterns: ["*.pfx", "*.p12", "*.pem", "*.key", "*.crt", ".env*"]
  # Role plików innych niż kod (kod rozpoznaje technologia projektu). Wygrywa PIERWSZA pasująca rola,
  # dlatego dependency stoi przed data (requirements.txt pasuje też do *.txt). Plik bez dopasowania -> other.
  # JSON jako config tylko pod typowymi nazwami konfiguracji - pozostałe *.json to zwykle dane albo wyniki
  # robota (data, nie trafiają do agentów jako tekst); nietypowo nazwaną konfigurację JSON dopisz do config.
  role_patterns:
    dependency: ["requirements*.txt", "pyproject.toml"]
    config: ["*.yml", "*.yaml", "*.toml", "*.ini", "*.cfg", "config*.json", "settings*.json", "appsettings*.json", "*.config.json"]
    launcher: ["*.bat", "*.cmd", "*.ps1"]
    docs: ["*.md", "*.rst", "README*", "*.docx", "*.pdf"]
    data: ["*.csv", "*.txt", "*.json", "*.xlsx", "*.xls", "*.db", "*.sqlite", "*.xml", "*.log"]
    binary: ["*.png", "*.jpg", "*.ico", "*.exe", "*.dll", "*.zip", "*.whl"]
  # Role plików przepisywanych dosłownie do mapy projektu (dla agentów i przewodnika) - tylko role z role_patterns;
  # pliki sekretów i kod nigdy. Plik większy niż max_text_file_kb zostaje tylko jako wpis na liście plików.
  text_roles: ["dependency", "config", "launcher"]
  max_text_file_kb: 100
  # Frameworki: rozpoznawane po ścieżkach (framework skopiowany do projektu) albo po pakietach importowanych
  # w kodzie (framework zainstalowany, także edytowalnie). knowledge - plik wiedzy dla agentów, względnie do
  # knowledge_base/knowledge/. Nowy framework = nowy wpis + plik wiedzy, bez zmian w kodzie.
  frameworks:
    roboforge:
      technology: python
      paths: ["roboforge_framework/*"]
      packages: ["roboforge"]
      knowledge: frameworks/roboforge.md
